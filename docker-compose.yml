version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ekai-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - APP_ENV=production
      - API_KEY=${API_KEY:-ekai_test_secret_key_12345}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_GEN_MODEL=${GROQ_GEN_MODEL:-llama-3.3-70b-versatile}
      - GROQ_FAST_MODEL=${GROQ_FAST_MODEL:-llama-3.1-8b-instant}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-enterprise_knowledge}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ekai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ekai-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ekai-network

  # Optional local Qdrant service for local development without Qdrant Cloud
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: ekai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    profiles:
      - local-qdrant
    restart: unless-stopped
    networks:
      - ekai-network

volumes:
  qdrant_storage:

networks:
  ekai-network:
    driver: bridge
